name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/cgi/lanzador
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'LanzadorCGI'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cgi.lanzador'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.cgi.lanzador'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
              <queries>
                  <package android:name="com.termux" />
              </queries>
              <application
                  android:label="CGI"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/cgi/lanzador/MainActivity.java << 'EOF'
          package com.cgi.lanzador;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static final String PERMISO = "com.termux.permission.RUN_COMMAND";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (checkSelfPermission(PERMISO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{PERMISO}, 1);
                  }

                  LinearLayout capa = new LinearLayout(this);
                  capa.setOrientation(LinearLayout.VERTICAL);
                  capa.setGravity(Gravity.CENTER);
                  capa.setBackgroundColor(Color.BLACK);
                  capa.setPadding(48, 48, 48, 48);

                  TextView titulo = new TextView(this);
                  titulo.setText("Lanzador CGI");
                  titulo.setTextColor(Color.GREEN);
                  titulo.setTextSize(28);
                  titulo.setGravity(Gravity.CENTER);

                  Button boton = new Button(this);
                  boton.setText("PROCESAR VIDEOS");
                  boton.setTextSize(20);
                  boton.setOnClickListener(v -> lanzar());

                  capa.addView(titulo);
                  capa.addView(boton);
                  setContentView(capa);
              }

              void lanzar() {
                  try {
                      String casa = "/data/data/com.termux/files/home";
                      Intent i = new Intent("com.termux.RUN_COMMAND");
                      i.setClassName("com.termux", "com.termux.app.RunCommandService");
                      i.putExtra("com.termux.RUN_COMMAND_PATH",
                              "/data/data/com.termux/files/usr/bin/bash");
                      i.putExtra("com.termux.RUN_COMMAND_ARGUMENTS",
                              new String[]{casa + "/cgi/procesar.sh"});
                      i.putExtra("com.termux.RUN_COMMAND_WORKDIR", casa);
                      i.putExtra("com.termux.RUN_COMMAND_BACKGROUND", false);
                      startService(i);
                      Toast.makeText(this, "Enviado a Termux", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lanzador-cgi
          path: app/build/outputs/apk/debug/app-debug.apk
