          package com.cgi.estudio;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              static final int REQ_VIDEOS = 1, REQ_CARPETA = 2;
              final List<Uri> videos = new ArrayList<>();
              Uri carpetaCodigo = null;
              TextView txtVideos, txtCarpeta, txtLog;
              ProgressBar barra;
              Button btnProcesar;
              ScrollView scroll;
              volatile boolean ocupado = false;
              SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                  prefs = getSharedPreferences("cgi", MODE_PRIVATE);
                  String guardada = prefs.getString("carpeta", null);
                  if (guardada != null) carpetaCodigo = Uri.parse(guardada);
                  copiarEjemplos();

                  LinearLayout raiz = new LinearLayout(this);
                  raiz.setOrientation(LinearLayout.VERTICAL);
                  raiz.setBackgroundColor(Color.BLACK);
                  raiz.setPadding(40, 80, 40, 40);

                  TextView titulo = texto("CGI Studio", Color.GREEN, 28);
                  Button btnVideos = boton("1. ELEGIR VIDEOS");
                  txtVideos = texto("Ningún video elegido", Color.LTGRAY, 14);
                  Button btnCarpeta = boton("2. ELEGIR CARPETA DE CÓDIGO CGI (opcional)");
                  txtCarpeta = texto("", Color.LTGRAY, 14);
                  btnProcesar = boton("3. PROCESAR");
                  barra = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  barra.setMax(100);
                  txtLog = texto("", Color.WHITE, 12);
                  scroll = new ScrollView(this);
                  scroll.addView(txtLog);

                  raiz.addView(titulo);
                  raiz.addView(btnVideos);
                  raiz.addView(txtVideos);
                  raiz.addView(btnCarpeta);
                  raiz.addView(txtCarpeta);
                  raiz.addView(btnProcesar);
                  raiz.addView(barra);
                  raiz.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(raiz);
                  actualizarCarpeta();

                  btnVideos.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("video/*");
                      i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      startActivityForResult(i, REQ_VIDEOS);
                  });
                  btnCarpeta.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                      startActivityForResult(i, REQ_CARPETA);
                  });
                  btnProcesar.setOnClickListener(v -> procesar());
              }

              TextView texto(String t, int color, int size) {
                  TextView tv = new TextView(this);
                  tv.setText(t);
                  tv.setTextColor(color);
                  tv.setTextSize(size);
                  tv.setPadding(0, 12, 0, 12);
                  return tv;
              }

              Button boton(String t) {
                  Button bt = new Button(this);
                  bt.setText(t);
                  return bt;
              }

              void actualizarCarpeta() {
                  txtCarpeta.setText(carpetaCodigo == null
                          ? "Usando los 2 ejemplos incluidos"
                          : "Carpeta: " + Uri.decode(carpetaCodigo.getLastPathSegment()));
              }

              void log(String t) {
                  runOnUiThread(() -> {
                      txtLog.append(t + "\n");
                      scroll.post(() -> scroll.fullScroll(ScrollView.FOCUS_DOWN));
                  });
              }

              String nombreDe(Uri u) {
                  try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          int k = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (k >= 0) return c.getString(k);
                      }
                  } catch (Exception e) { }
                  return "video";
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null) return;
                  if (req == REQ_VIDEOS) {
                      videos.clear();
                      if (data.getClipData() != null) {
                          for (int i = 0; i < data.getClipData().getItemCount(); i++) {
                              videos.add(data.getClipData().getItemAt(i).getUri());
                          }
                      } else if (data.getData() != null) {
                          videos.add(data.getData());
                      }
                      StringBuilder sb = new StringBuilder(videos.size() + " video(s): ");
                      for (Uri u : videos) sb.append(nombreDe(u)).append("  ");
                      txtVideos.setText(sb.toString());
                  } else if (req == REQ_CARPETA) {
                      Uri u = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception e) { }
                      carpetaCodigo = u;
                      prefs.edit().putString("carpeta", u.toString()).apply();
                      actualizarCarpeta();
                  }
              }

              void copiarEjemplos() {
                  try {
                      File dir = new File(getFilesDir(), "ejemplos");
                      dir.mkdirs();
                      String[] lista = getAssets().list("ejemplos");
                      if (lista == null) return;
                      for (String n : lista) {
                          try (InputStream in = getAssets().open("ejemplos/" + n);
                               OutputStream out = new FileOutputStream(new File(dir, n))) {
                              copiar(in, out);
                          }
                      }
                  } catch (Exception e) {
                      log("No se pudieron copiar los ejemplos: " + e);
                  }
              }

              static void copiar(InputStream in, OutputStream out) throws Exception {
                  byte[] buf = new byte[65536];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
              }

              String prepararCarpeta() {
                  File demo = new File(getFilesDir(), "ejemplos");
                  if (carpetaCodigo == null) return demo.getAbsolutePath();
                  File dir = new File(getFilesDir(), "efectos_usuario");
                  dir.mkdirs();
                  File[] viejos = dir.listFiles();
                  if (viejos != null) for (File f : viejos) f.delete();
                  int copiados = 0;
                  try {
                      Uri hijos = DocumentsContract.buildChildDocumentsUriUsingTree(carpetaCodigo,
                              DocumentsContract.getTreeDocumentId(carpetaCodigo));
                      try (Cursor c = getContentResolver().query(hijos,
                              new String[]{DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                                      DocumentsContract.Document.COLUMN_DISPLAY_NAME}, null, null, null)) {
                          while (c != null && c.moveToNext()) {
                              String nombre = c.getString(1);
                              if (nombre == null || !nombre.endsWith(".py")) continue;
                              Uri doc = DocumentsContract.buildDocumentUriUsingTree(carpetaCodigo, c.getString(0));
                              try (InputStream in = getContentResolver().openInputStream(doc);
                                   OutputStream out = new FileOutputStream(new File(dir, nombre))) {
                                  copiar(in, out);
                                  copiados++;
                              }
                          }
                      }
                  } catch (Exception e) {
                      log("Error leyendo la carpeta de código: " + e);
                  }
                  if (copiados == 0) {
                      log("No encontré archivos .py en la carpeta elegida; uso los ejemplos.");
                      return demo.getAbsolutePath();
                  }
                  return dir.getAbsolutePath();
              }

              void procesar() {
                  if (ocupado) return;
                  if (videos.isEmpty()) {
                      Toast.makeText(this, "Elige al menos un video", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  ocupado = true;
                  btnProcesar.setEnabled(false);
                  final String carpeta = prepararCarpeta();
                  final List<Uri> lista = new ArrayList<>(videos);
                  new Thread(() -> {
                      try {
                          for (Uri u : lista) {
                              String nombre = nombreDe(u);
                              log("\n>> " + nombre);
                              runOnUiThread(() -> barra.setProgress(0));
                              File tmp = new File(getCacheDir(), "tmp_cgi.mp4");
                              try {
                                  new Procesador(this, u, carpeta, new Procesador.Aviso() {
                                      public void texto(String t) { log(t); }
                                      public void progreso(int p) { runOnUiThread(() -> barra.setProgress(p)); }
                                  }).ejecutar(tmp);
                                  String base = nombre.contains(".") ? nombre.substring(0, nombre.lastIndexOf('.')) : nombre;
                                  guardar(tmp, base + "_cgi.mp4");
                                  log("Listo: Películas/CGI/" + base + "_cgi.mp4");
                              } catch (Throwable e) {
                                  log("ERROR: " + e);
                              } finally {
                                  tmp.delete();
                              }
                          }
                      } finally {
                          ocupado = false;
                          runOnUiThread(() -> btnProcesar.setEnabled(true));
                      }
                  }).start();
              }

              void guardar(File f, String nombre) throws Exception {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Video.Media.DISPLAY_NAME, nombre);
                  v.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                  v.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/CGI");
                  Uri u = getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                  try (OutputStream out = getContentResolver().openOutputStream(u);
                       InputStream in = new FileInputStream(f)) {
                      copiar(in, out);
                  }
              }
          }
